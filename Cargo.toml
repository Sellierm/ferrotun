[package]
name = "ferrotun"
version = "0.1.0"
edition = "2024"
description = "Containerized WireGuard client with a kill-switch, written in Rust"
license = "MIT"
publish = false

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
base64 = "0.23.1"
futures = "0.3.34"
ipnet = "2.12.2"
netlink-packet-route = "0.33.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls-no-provider", "form", "query"] }
rtnetlink = "0.23.0"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12", "logging"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
webpki-roots = "1.0.11"
wireguard-control = "2.0.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
